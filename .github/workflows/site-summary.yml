# Checks the README's site-summary section, which is copied daily onto this project's
# card on https://mendus59.github.io. See "Site summary" in CLAUDE.md.
name: Site summary

on:
  pull_request:
  push:
    branches: [main]
    paths: [README.md]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the summary section's format
        run: |
          curl -fsSL https://raw.githubusercontent.com/mendus59/mendus59.github.io/main/scripts/sync-summaries.mjs \
            -o "$RUNNER_TEMP/sync-summaries.mjs"
          node "$RUNNER_TEMP/sync-summaries.mjs" --check README.md
      - name: Remind to update the summary
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx README.md; then
            echo "::notice title=Site summary::README.md is unchanged. If this PR changes what the project does, update the site-summary section in README.md."
          fi
